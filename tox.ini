[tox]
envlist = py38,py39,py310,py311,py312,py313,py314,cover

[testenv]
commands =
    python setup.py develop
    pytest
deps =
    pytest
    mock

[testenv:cover]
basepython =
    python3
commands = 
    pytest --cov=pyramid_deform --cov-report=xml
deps =
    pytest
    pytest-cov
    mock
